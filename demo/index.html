<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Styles Barbershop 2 — Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #1a1815; overflow: hidden; height: 100vh; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #root { width: 100vw; height: 100vh; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  /* Hide scrollbars on inner phone screens */
  .ph-scroll::-webkit-scrollbar { display: none; }
  .ph-scroll { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#0a0a0a"/>
    <g transform="translate(100 100)" stroke="#C9A961" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-30 -25 L-5 0 L-30 25" />
      <path d="M30 -25 L5 0 L30 25" />
      <circle cx="-22" cy="0" r="6"/>
      <circle cx="22" cy="0" r="6"/>
    </g>
    <text x="100" y="160" text-anchor="middle" fill="#C9A961" font-family="Georgia, serif" font-size="14" font-style="italic" letter-spacing="2">STYLES</text>
  </svg>
</template>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Plain JS (theme + data) -->
<script src="theme.js"></script>
<script src="data.js"></script>

<!-- Components (order matters: helpers first) -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="messaging.jsx"></script>
<script type="text/babel" src="landing-publica.jsx"></script>
<script type="text/babel" src="web-publica.jsx"></script>
<script type="text/babel" src="portal-barbero.jsx"></script>
<script type="text/babel" src="portal-dueno.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
